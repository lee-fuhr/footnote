<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footnote roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F3EC; --ink: #1C1814;
      --tan-accent: #8B6F47; --gps-dot: #9E8A70;
      --rule: #D4C4A8; --tan-fill: rgba(139,111,71,.10);
      --font-body: 'EB Garamond', Georgia, serif;
      --font-mono: 'IBM Plex Mono', Menlo, monospace;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
    body { padding: 40px 24px 80px; max-width: 560px; margin: 0 auto; }
    .back { font-family: var(--font-mono); font-size: .72rem; color: var(--gps-dot); text-decoration: none; display: inline-block; margin-bottom: 32px; }
    .wordmark { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; font-family: var(--font-body); font-size: 1.1rem; color: var(--ink); letter-spacing: -.01em; }
    .wordmark em { font-style: italic; color: var(--tan-accent); }
    .back:hover { color: var(--tan-accent); }
    h1 { font-size: 1.8rem; font-weight: 400; font-style: italic; color: var(--tan-accent); margin-bottom: 8px; }
    .subtitle { font-family: var(--font-mono); font-size: .72rem; color: var(--gps-dot); margin-bottom: 40px; }
    .feature-list { display: flex; flex-direction: column; gap: 16px; }
    .feature-card { background: var(--tan-fill); border: 1px solid rgba(139,111,71,.18); border-radius: 10px; padding: 20px; }
    .feature-name { font-size: 1.15rem; color: var(--ink); margin-bottom: 6px; }
    .feature-desc { font-family: var(--font-body); font-size: .9rem; color: var(--gps-dot); line-height: 1.55; margin-bottom: 14px; }
    .feature-stats { display: flex; gap: 16px; }
    .stat { font-family: var(--font-mono); font-size: .72rem; color: var(--tan-accent); }
    .stat-label { color: var(--gps-dot); margin-left: 4px; }
    .loading { font-style: italic; color: var(--gps-dot); font-size: 1rem; }
    .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); font-family: var(--font-mono); font-size: .72rem; color: var(--gps-dot); }
    .footer a { color: var(--tan-accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Roadmap</h1>
  <p class="subtitle">What we&#8217;re thinking about building. Tap to show interest.</p>

  <div id="features" class="feature-list">
    <p class="loading">Loading&#8230;</p>
  </div>

  <div class="footer">
    <p>
      <a class="link-philosophy" href="/about.html">About</a> &middot;
      <a class="link-philosophy" href="https://footnote-tan.vercel.app">App</a> &middot;
      <a class="link-philosophy" href="/philosophy.html">Philosophy</a>
    </p>
    <!-- No copyright. No "Made by." We trust the work. See /philosophy. -->
  </div>

  <script>
    fetch('/api/vote/results')
      .then(r => r.json())
      .then(features => {
        const el = document.getElementById('features')
        if (!features.length) { el.innerHTML = '<p class="loading">Nothing to show yet.</p>'; return }
        el.innerHTML = features.map(f => `
          <div class="feature-card">
            <p class="feature-name">${esc(f.label)}</p>
            <p class="feature-desc">${esc(f.desc)}</p>
            <div class="feature-stats">
              <span class="stat">${f.taps}<span class="stat-label">taps</span></span>
              <span class="stat">${f.people}<span class="stat-label">people</span></span>
            </div>
          </div>
        `).join('')
      })
      .catch(() => {
        document.getElementById('features').innerHTML = '<p class="loading">Couldn&#8217;t load results.</p>'
      })

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }
  </script>

</html>
